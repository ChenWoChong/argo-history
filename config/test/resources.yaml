apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: history-demo
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: history-demo
            namespace: default
  template:
    metadata:
      name: "{{name}}"
      labels:
        app.kubernetes.io/managed-by: argo-history-smoke
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated: {}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: history-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: default
