image:
  repository: truth-ai-registry.cn-hangzhou.cr.aliyuncs.com/test/argo-history
  tag: dev
  pullPolicy: IfNotPresent

initContainer:
  image: truth-ai-registry.cn-hangzhou.cr.aliyuncs.com/third-party/busybox:1.35

serviceAccount:
  create: true
  name: ""

service:
  nodePort: 32080

history:
  rootDir: /var/lib/argo-history
  retentionDays: 14
  persistence:
    enabled: true
    existingClaim: ""
    mountPath: /var/lib/argo-history
    storageClassName:
    accessModes:
    - ReadWriteOnce
    size: 2Gi
    createPv: false
    reclaimPolicy: Retain
    hostPath:
      path: /var/lib/argo-history
      type: DirectoryOrCreate

webhook:
  servicePort: 443
  failurePolicy: Ignore
  timeoutSeconds: 10
  matchPolicy: Equivalent
  sideEffects: NoneOnDryRun

certManager:
  enabled: true
  issuer:
    create: true
    kind: Issuer
    name: ""
  certificate:
    secretName: ""
    duration: 2160h
    renewBefore: 360h
