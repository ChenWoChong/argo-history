{{- if .Values.certManager.enabled }}
{{- if .Values.certManager.issuer.create }}
apiVersion: cert-manager.io/v1
kind: {{ .Values.certManager.issuer.kind }}
metadata:
  name: {{ include "argo-history.issuerName" . }}
  labels:
    {{- include "argo-history.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "argo-history.certificateName" . }}
  labels:
    {{- include "argo-history.labels" . | nindent 4 }}
spec:
  secretName: {{ include "argo-history.webhookSecretName" . }}
  duration: {{ .Values.certManager.certificate.duration }}
  renewBefore: {{ .Values.certManager.certificate.renewBefore }}
  dnsNames:
    - {{ include "argo-history.webhookServiceName" . }}
    - {{ include "argo-history.webhookServiceName" . }}.{{ .Release.Namespace }}
    - {{ include "argo-history.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "argo-history.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ include "argo-history.issuerName" . }}
    kind: {{ .Values.certManager.issuer.kind }}
{{- end }}
