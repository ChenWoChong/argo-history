apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argo-history.configMapName" . }}
  labels:
    {{- include "argo-history.labels" . | nindent 4 }}
data:
  config.yaml: |-
    server:
      http_bind_addr: 0.0.0.0:8080
      webhook_bind_addr: 0.0.0.0:9443
      tls:
        cert_path: /certs/tls.crt
        key_path: /certs/tls.key
    history:
      root_dir: {{ .Values.history.rootDir }}
